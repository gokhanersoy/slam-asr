model_config:
  file: "src/models/slam_model.py:model_factory"
  llm_name: "Qwen/Qwen2.5-7B-Instruct"
  llm_path: "Qwen/Qwen2.5-7B-Instruct"
  llm_dim: 3584
  encoder_name: "whisper"
  encoder_path: "openai/whisper-large-v3"
  encoder_dim: 1280
  encoder_projector: "linear"
  encoder_projector_ds_rate: 5
  whisper_decode: false
  encoder_path_hf: null

dataset_config:
  dataset: "speech_dataset"
  train_data_path: "/content/data/train.jsonl"
  val_data_path: "/content/data/val.jsonl"
  test_data_path: "/content/data/test.jsonl"
  input_type: "mel"
  mel_size: 128
  prompt: "Aşağıdaki konuşma sesini Türkçe metne dönüştürün. Sadece konuşmanın tam transcriptini yazın."
  fix_length_audio: -1
  inference_mode: false

train_config:
  model_name: "slam_asr_tr"
  output_dir: "checkpoints/slam_qwen_tr"
  batch_size_training: 4
  val_batch_size: 4
  gradient_accumulation_steps: 4
  num_epochs: 5
  warmup_steps: 500
  total_steps: 10000
  lr: 1e-4
  validation_interval: 500
  freeze_encoder: true
  freeze_llm: true
  use_peft: true
  use_fp16: true
  use_gradient_checkpointing: true
  quantization: true # 4-bit / 8-bit quantization for Colab T4/V100/A100
  seed: 42
  num_workers_dataloader: 2

peft_config:
  peft_method: "lora"
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
